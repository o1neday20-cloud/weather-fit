# ================================================================
# fluent.conf — WeatherFit 로그 수집 설정
#
# 흐름:
#   앱(fetch) → Fluentd HTTP(24224) → Kafka 토픽별 라우팅
# ================================================================

# ── 입력: HTTP 엔드포인트 ──────────────────────────────────────
<source>
  @type http
  port 24224
  bind 0.0.0.0
  body_size_limit 32m
  keepalive_timeout 10s
  # CORS 허용 (브라우저에서 직접 전송 시)
  add_http_headers true
  cors_allow_origins ["*"]
  <parse>
    @type json
  </parse>
</source>

# ── 행동 로그 → Kafka weatherfit.behavior ─────────────────────
<match weatherfit.behavior>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.behavior

  <buffer topic>
    @type file
    path /fluentd/log/behavior
    flush_mode interval
    flush_interval 3s          # 3초마다 Kafka로 전송
    chunk_limit_size 8m
    retry_max_times 5
    retry_wait 3s
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 구매 이벤트 → Kafka weatherfit.purchase ───────────────────
<match weatherfit.purchase>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.purchase

  <buffer topic>
    @type file
    path /fluentd/log/purchase
    flush_mode interval
    flush_interval 2s
    chunk_limit_size 8m
    retry_max_times 5
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 온도 피드백 → Kafka weatherfit.feedback ───────────────────
<match weatherfit.feedback>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.feedback

  <buffer topic>
    @type file
    path /fluentd/log/feedback
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 8m
    retry_max_times 5
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 옷장 추가 → Kafka weatherfit.wardrobe ─────────────────────
<match weatherfit.wardrobe>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.wardrobe

  <buffer topic>
    @type file
    path /fluentd/log/wardrobe
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 8m
    retry_max_times 5
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 찜 이벤트 → Kafka weatherfit.wishlist ─────────────────────
<match weatherfit.wishlist>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.wishlist

  <buffer topic>
    @type file
    path /fluentd/log/wishlist
    flush_mode interval
    flush_interval 3s
    chunk_limit_size 8m
    retry_max_times 5
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 나머지 모든 태그 → Kafka weatherfit.etc ───────────────────
<match weatherfit.**>
  @type kafka2
  brokers "#{ENV['KAFKA_BROKER'] || 'kafka:9092'}"
  default_topic weatherfit.etc

  <buffer topic>
    @type memory
    flush_mode interval
    flush_interval 10s
  </buffer>

  <format>
    @type json
  </format>
</match>

# ── 에러 로그 파일 출력 ────────────────────────────────────────
<label @ERROR>
  <match **>
    @type file
    path /fluentd/log/error
    append true
    <format>
      @type json
    </format>
    <buffer>
      flush_mode interval
      flush_interval 60s
    </buffer>
  </match>
</label>
