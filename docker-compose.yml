version: '3.8'

services:
  # ── Zookeeper (Kafka 코디네이터) ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: weatherfit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    restart: unless-stopped

  # ── Kafka Broker ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: weatherfit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"       # 내부 통신
      - "29092:29092"     # 외부(호스트) 접근용
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168       # 7일 보관
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1GB
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Kafka UI (토픽/메시지 모니터링) ──────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: weatherfit-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: weatherfit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  # ── Fluentd (로그 수집 에이전트) ─────────────────────────────
  fluentd:
    build:
      context: ./fluentd
      dockerfile: Dockerfile
    container_name: weatherfit-fluentd
    depends_on:
      - kafka
    ports:
      - "24224:24224"     # HTTP 수집 포트 (앱 → Fluentd)
      - "24224:24224/udp"
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - fluentd-log:/fluentd/log
    environment:
      KAFKA_BROKER: kafka:9092
    restart: unless-stopped

  # ── Kafka Consumer (메시지 → MySQL) ──────────────────────────
  kafka-consumer:
    build:
      context: ./kafka-consumer
      dockerfile: Dockerfile
    container_name: weatherfit-consumer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: host.docker.internal   # 호스트의 MySQL 접근
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: weather_fit
      CONSUMER_GROUP: weatherfit-consumer-group
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  fluentd-log:
